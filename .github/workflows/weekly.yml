name: Weekly plan
# Mondays at 15:00 UTC (11 am New York in summer, 10 am in winter), after the open.
# Refreshes the universe and the full ten year history, then freezes the week's plan.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
concurrency:
  group: sd-pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Refresh the universe
        run: python scripts/build_universe.py
      - name: Refetch full price history
        run: python scripts/update_prices.py --full
      - name: Rebuild panel, candidates and exit study
        run: |
          python scripts/engine.py
          python scripts/screener.py
          python scripts/exits.py dashboard
      - name: Freeze the weekly plan and build the page
        run: |
          python scripts/attention.py --set-plan
          python scripts/render_site.py
      - name: Save results
        run: |
          git config user.name "singles-doubles-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data output site
          git diff --cached --quiet || git commit -m "Weekly plan $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
